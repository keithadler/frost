[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "frostlang"
version = "0.3.0"
description = "A readable, safe scripting language that turns English into shell commands"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Keith Elliott" }]
keywords = ["shell", "scripting", "language", "hypertalk", "audit", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Interpreters",
    "Topic :: System :: Shells",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/keithelliott/frost"
Documentation = "https://github.com/keithelliott/frost/blob/main/LANGUAGE.md"

[project.scripts]
frost = "frostlang.cli:main"

[tool.setuptools]
packages = ["frostlang"]
