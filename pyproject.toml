[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "frostlang"
version = "0.3.0"
description = "A readable, safe scripting language that turns English into shell commands"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Keith Elliott" }]
keywords = ["shell", "scripting", "language", "hypertalk", "audit", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Interpreters",
    "Topic :: System :: Shells",
    "Topic :: Security",
]

[project.optional-dependencies]
# The interpreter itself has no dependencies. These are for the test suite
# and the page builders.
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "markdown>=3.4",
]

[project.urls]
Homepage = "https://github.com/keithadler/frost"
Documentation = "https://github.com/keithadler/frost/blob/main/LANGUAGE.md"

[project.scripts]
frost = "frostlang.cli:main"

[tool.setuptools]
packages = ["frostlang"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Anything that shells out to real programs or drives the CLI as a
# subprocess is slower than the rest; `-m "not slow"` skips them.
markers = ["slow: shells out to real programs"]
