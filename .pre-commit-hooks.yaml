# frost as a pre-commit hook.
#
# `--check --strict` is the form that belongs in a hook: it parses the script,
# reports the verdict, and exits 1 when that verdict is dangerous. Plain
# `--check` reports and exits 0 on purpose, which is right for a person at a
# terminal and useless as a gate.
#
# Add to .pre-commit-config.yaml:
#
#   repos:
#     - repo: https://github.com/keithadler/frost
#       rev: v0.9.0
#       hooks:
#         - id: frost-check
#
# The policy hook takes the policy path as an argument, because there is no
# sensible default: a policy that frost invented would be one nobody agreed to.
#
#         - id: frost-policy
#           args: [--policy, .frost-policy]

- id: frost-check
  name: frost check
  description: Parse every frost script and refuse a dangerous verdict.
  entry: frost --check --strict
  language: python
  files: \.frost$

# --explain exits 1 on a dangerous verdict, so this stops a commit as well as
# describing it. The first version of this file called it informational, which
# was wrong in the way that matters: somebody adds it expecting a log line and
# gets a blocked commit. Use it *instead of* frost-check, not alongside, and
# take it out if you only want the manifest in the log.
- id: frost-explain
  name: frost explain
  description: Print the full manifest, and stop on a dangerous verdict.
  entry: frost --explain
  language: python
  files: \.frost$
  verbose: true

- id: frost-policy
  name: frost policy
  description: Refuse any script a policy forbids. Pass --policy PATH.
  entry: frost --check --strict
  language: python
  files: \.frost$

# --write, or this reformats nothing. Without it `--format` prints the
# canonical layout to standard output, the file on disk is untouched, and the
# hook passes every time: a formatting hook that silently does nothing is
# worse than no hook, because it is believed.
- id: frost-format
  name: frost format
  description: Rewrite frost scripts in canonical form, in place.
  entry: frost --format --write
  language: python
  files: \.frost$
