name: CI

on:
  push:
    branches: [main, master, world-class]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install bubblewrap, so the Linux sandbox backend is exercised
        if: runner.os == 'Linux'
        # Without it every sandbox test skips, and a backend nobody has run
        # is a backend nobody has.
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through
          # AppArmor, and bwrap needs one — without this it cannot start at
          # all, and the sandbox tests skip rather than run.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Does the backend actually confine here?
        # Asserted, now that it has been observed passing on both runner
        # images. If a future image restricts user namespaces again this goes
        # red, which is the point — a backend nobody has run is a backend
        # nobody has, and that should never surface as a silent skip.
        run: |
          python -c "import frostlang.sandbox as s; ok, why = s.self_test(); \
            print('backend:', s.describe_backend()); print('confines:', ok, '|', why); \
            raise SystemExit(0 if ok else 1)"

      - name: Test
        env:
          # Both platforms confine, so neither is allowed to skip the sandbox
          # tests and still call the suite green.
          FROST_REQUIRE_SANDBOX: "1"
        run: python -m pytest tests/ -q

      - name: The keystore is optional — everything else works without it
        run: |
          python -m pip uninstall -y cryptography
          python -m pytest tests/ -q
          python -m pip install "cryptography>=42"

      - name: Install as a package and run a script through the entry point
        # Catches a broken [project.scripts] or a missing module, which the
        # test suite would not: it imports frostlang from the source tree.
        run: |
          pip install .
          frost --version
          frost examples/hello.frost
          frost --explain examples/logreport.frost

  generated:
    name: Generated files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: The browser evaluator agrees with the interpreter
        run: python tools/verify_chunks.py

      - name: Rebuild every generated file
        run: |
          python tools/build_model_spec.py
          python tools/build_docs.py
          python tools/build_play.py
          python tools/build_audit.py
          python tools/build_editors.py

      - name: Nothing changed
        # A generated file committed out of date is a lie that survives review,
        # because nobody re-runs the builder to check.
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::a generated file is out of date; run the builders and commit the result"
            exit 1
          fi

      - name: The examples are canonically formatted
        run: |
          for f in examples/*.frost; do
            python frost --format "$f" | diff -u "$f" - \
              || { echo "::error file=$f::not canonically formatted"; exit 1; }
          done

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Measure
        env:
          FROST_REQUIRE_SANDBOX: "1"
        run: |
          python -m pytest tests/ -q \
            --cov=frostlang --cov-report=term-missing --cov-fail-under=90
