name: Release

# Publishing to PyPI, triggered by a version tag.
#
# The README has told people to `pip install "frostlang[keystore]"` since
# before there was anything on PyPI to install, and the GitHub Action had to
# work around the same 404 by installing from $GITHUB_ACTION_PATH. Every other
# improvement is worth less than the front page instruction being true.
#
# Trusted publishing, so there is no API token in this repository to leak or
# rotate: PyPI verifies the workflow's OIDC identity instead. That needs a
# one-time setup on PyPI, described in CONTRIBUTING.md, and it fails loudly
# rather than silently publishing nothing if it has not been done.
#
# The build is checked before it is uploaded. A package that installs but
# cannot run is worse than no package, because it fails on somebody else's
# machine at the moment they were deciding whether to trust this.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: The metadata is well formed
        run: python -m twine check dist/*

      - name: The tag matches the version in pyproject
        # A tag that disagrees with the package version publishes something
        # nobody can find again from the release page.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $declared in pyproject.toml"
            exit 1
          fi

      - name: The wheel installs and the command works
        # Installed from the built artefact into a clean environment, not from
        # the checkout. Testing the source tree proves the source tree works,
        # which was never in doubt.
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/frost --version
          printf 'run "echo" with "packaged"\nput it\n' > /tmp/smoke.frost
          /tmp/clean/bin/frost --check /tmp/smoke.frost
          /tmp/clean/bin/frost --explain /tmp/smoke.frost
          test "$(/tmp/clean/bin/frost /tmp/smoke.frost)" = "packaged"

      - name: The console script survives without the optional extras
        # The install claim is Python and nothing else. Everything except the
        # keystore has to work on a bare install, and the keystore has to
        # refuse rather than crash.
        run: |
          printf 'put the secret "x" into t\n' > /tmp/needs_keystore.frost
          /tmp/clean/bin/frost --check /tmp/needs_keystore.frost

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/frostlang
    permissions:
      id-token: write        # trusted publishing; no token stored here
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  container:
    name: Publish the container
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # ghcr, using the workflow's own token
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        # The very wheel this run built and published, rather than a copy
        # fetched back from PyPI. The index is eventually consistent across
        # edges, so a probe from the runner can report the version available
        # while the build container, talking to a different edge, cannot find
        # it. That is exactly how v0.9.2 failed.
        with:
          name: dist
          path: dist/

      - name: The version, without the leading v
        # github.ref_name is "v0.9.1" and pip needs "0.9.1". Passing the tag
        # straight through asked for a version that does not exist.
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # arm64 as well as amd64. The first image published was amd64 only, so
      # every Apple Silicon machine and every arm64 runner pulled something it
      # had to emulate, which is slow enough that people stop using it and
      # never say why.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            FROST_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/frost:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/frost:latest
