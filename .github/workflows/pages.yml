name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one half way: a cancelled deploy can
# leave the site serving a mixture of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Build the pages
        # Rebuilt rather than copied from the commit, so what is published is
        # what the current source produces. build_play refuses outright if the
        # browser evaluator disagrees with the interpreter.
        run: |
          python tools/build_docs.py
          python tools/build_play.py
          python tools/build_audit.py
          python tools/build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
